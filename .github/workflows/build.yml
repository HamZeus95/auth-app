name: Build and Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/hamzeus95/auth-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update platform repo with new image tag
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/HamZeus95/platform.git /tmp/platform
          cd /tmp/platform
          MANIFEST=manifests/auth-app/base/deployment.yaml
          test -f "$MANIFEST" || { echo "::error::$MANIFEST missing - platform repo layout changed"; exit 1; }
          before=$(sha1sum "$MANIFEST" | cut -d' ' -f1)
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" "$MANIFEST"
          after=$(sha1sum "$MANIFEST" | cut -d' ' -f1)
          # A no-op sed used to be indistinguishable from "already up to date",
          # so a moved file would silently stop deployments. Fail loudly instead.
          if [ "$before" = "$after" ]; then
            grep -q "image: ${{ env.IMAGE }}:${{ github.sha }}" "$MANIFEST" \
              || { echo "::error::image line did not match in $MANIFEST"; exit 1; }
            echo "already at ${{ github.sha }}, nothing to push"; exit 0
          fi
          git config user.email "ci@homelab.local"
          git config user.name "CI Bot"
          git add "$MANIFEST"
          git commit -m "deploy auth-app@${{ github.sha }}"
          git push
