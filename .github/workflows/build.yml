name: Build and Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/hamzeus95/auth-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update platform repo with new image tag
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/HamZeus95/platform.git /tmp/platform
          cd /tmp/platform
          # The overlays' kustomize image transformer is the single source of
          # truth for the tag; it drives both the Deployment and the seed Job.
          FILES="manifests/auth-app/overlays/dev/kustomization.yaml manifests/auth-app/overlays/prod/kustomization.yaml"
          for f in $FILES; do
            test -f "$f" || { echo "::error::$f missing - platform repo layout changed"; exit 1; }
            grep -q '^    newTag:' "$f" || { echo "::error::no newTag: line in $f"; exit 1; }
            sed -i "s|^    newTag: .*|    newTag: ${{ github.sha }}|" "$f"
          done
          git config user.email "ci@homelab.local"
          git config user.name "CI Bot"
          git add $FILES
          if git diff --cached --quiet; then
            echo "already at ${{ github.sha }}, nothing to push"; exit 0
          fi
          git commit -m "deploy auth-app@${{ github.sha }}"
          git push
